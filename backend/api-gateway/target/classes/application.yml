spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          # Strip duplicate CORS headers added by both gateway and downstream services
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

          routes:
            # ── Auth Service ────────────────────────────────────────────────────
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            # ── Employee Service ────────────────────────────────────────────────
            - id: employee-service
              uri: lb://employee-service
              predicates:
                - Path=/api/employees/**, /api/departments/**, /api/designations/**, /api/audit/**

            # ── Attendance Service ──────────────────────────────────────────────
            - id: attendance-service
              uri: lb://attendance-service
              predicates:
                - Path=/api/attendance/**

            # ── Leave Service ───────────────────────────────────────────────────
            - id: leave-service
              uri: lb://leave-service
              predicates:
                - Path=/api/leave/**

            # ── Notification Service ────────────────────────────────────────────
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**

            # ── AI Agent Service ────────────────────────────────────────────────
            - id: ai-agent-service
              uri: lb://ai-agent-service
              predicates:
                - Path=/api/ai/**

server:
  port: ${GATEWAY_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

# JWT secret — must match auth-service exactly
attendai:
  security:
    jwt-secret: ${JWT_SECRET:attendai-attendai-attendai-attendai-attendai-attendai-attendai-attendai}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.attendai.gateway: DEBUG
