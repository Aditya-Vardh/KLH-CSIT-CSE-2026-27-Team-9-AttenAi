spring:
  application:
    name: attendance-service
  datasource:
    url: ${ATTENDANCE_DB_URL:jdbc:mysql://localhost:3307/attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ATTENDANCE_DB_USERNAME:root}
    password: ${ATTENDANCE_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${ATTENDANCE_SERVICE_PORT:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

attendai:
  attendance:
    expected-check-in: ${EXPECTED_CHECK_IN:09:00}
    standard-hours: ${STANDARD_HOURS:8.0}
