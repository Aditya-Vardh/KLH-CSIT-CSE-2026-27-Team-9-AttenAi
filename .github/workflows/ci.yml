name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: build and test each service ────────────────────────────────────
  backend:
    name: Backend — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: eureka-server
            path: backend/eureka-server/eureka-server
          - service: auth-service
            path: backend/auth-service
          - service: api-gateway
            path: backend/api-gateway
          - service: employee-service
            path: backend/employee-service
          - service: attendance-service
            path: backend/attendance-service
          - service: leave-service
            path: backend/leave-service
          - service: notification-service
            path: backend/notification-service
          - service: ai-agent-service
            path: backend/ai-agent-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build & test ${{ matrix.service }}
        run: mvn -B test --no-transfer-progress
        working-directory: ${{ matrix.path }}

  # ── Frontend: install, lint, build ─────────────────────────────────────────
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
