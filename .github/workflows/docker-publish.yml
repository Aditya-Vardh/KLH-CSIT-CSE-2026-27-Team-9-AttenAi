name: CD — Build & Push Docker Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/attendai

jobs:
  build-and-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: eureka-server
            context: backend/eureka-server/eureka-server
            port: 8761
          - service: auth-service
            context: backend/auth-service
            port: 8081
          - service: api-gateway
            context: backend/api-gateway
            port: 8080
          - service: employee-service
            context: backend/employee-service
            port: 8082
          - service: attendance-service
            context: backend/attendance-service
            port: 8083
          - service: leave-service
            context: backend/leave-service
            port: 8084
          - service: notification-service
            context: backend/notification-service
            port: 8085
          - service: ai-agent-service
            context: backend/ai-agent-service
            port: 8086
          - service: frontend
            context: frontend
            port: 80

    steps:
      - uses: actions/checkout@v4

      # Build JAR for backend services
      - name: Set up JDK 17
        if: matrix.service != 'frontend'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build JAR
        if: matrix.service != 'frontend'
        run: mvn -B package -DskipTests --no-transfer-progress
        working-directory: ${{ matrix.context }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
