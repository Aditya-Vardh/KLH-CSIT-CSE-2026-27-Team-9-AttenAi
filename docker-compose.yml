version: "3.9"

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  attendai-net:
    driver: bridge

# ── Shared health-check defaults ─────────────────────────────────────────────
x-healthcheck: &default-healthcheck
  interval: 15s
  timeout: 10s
  retries: 5
  start_period: 40s

services:

  # ── MySQL databases (one per service) ────────────────────────────────────────
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    networks: [attendai-net]
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]

  mysql-employee:
    image: mysql:8.0
    container_name: mysql-employee
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: employee_db
    ports:
      - "3308:3306"
    volumes:
      - mysql-employee-data:/var/lib/mysql
    networks: [attendai-net]
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]

  mysql-attendance:
    image: mysql:8.0
    container_name: mysql-attendance
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: attendance_db
    ports:
      - "3309:3306"
    volumes:
      - mysql-attendance-data:/var/lib/mysql
    networks: [attendai-net]
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]

  mysql-leave:
    image: mysql:8.0
    container_name: mysql-leave
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: leave_db
    ports:
      - "3310:3306"
    volumes:
      - mysql-leave-data:/var/lib/mysql
    networks: [attendai-net]
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]

  mysql-notification:
    image: mysql:8.0
    container_name: mysql-notification
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: notification_db
    ports:
      - "3311:3306"
    volumes:
      - mysql-notification-data:/var/lib/mysql
    networks: [attendai-net]
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]

  mysql-ai:
    image: mysql:8.0
    container_name: mysql-ai
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ai_db
    ports:
      - "3312:3306"
    volumes:
      - mysql-ai-data:/var/lib/mysql
    networks: [attendai-net]
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]

  # ── Eureka Server ─────────────────────────────────────────────────────────────
  eureka-server:
    build:
      context: ./backend/eureka-server/eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks: [attendai-net]
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]

  # ── Auth Service ──────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      AUTH_DB_URL: jdbc:mysql://mysql-auth:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      AUTH_DB_USERNAME: root
      AUTH_DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICE_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-attendai-attendai-attendai-attendai-attendai-attendai-attendai-attendai}
    depends_on:
      mysql-auth:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks: [attendai-net]

  # ── API Gateway ───────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICE_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-attendai-attendai-attendai-attendai-attendai-attendai-attendai-attendai}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks: [attendai-net]

  # ── Employee Service ──────────────────────────────────────────────────────────
  employee-service:
    build:
      context: ./backend/employee-service
      dockerfile: Dockerfile
    container_name: employee-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      EMPLOYEE_DB_URL: jdbc:mysql://mysql-employee:3306/employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      EMPLOYEE_DB_USERNAME: root
      EMPLOYEE_DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICE_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql-employee:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks: [attendai-net]

  # ── Attendance Service ────────────────────────────────────────────────────────
  attendance-service:
    build:
      context: ./backend/attendance-service
      dockerfile: Dockerfile
    container_name: attendance-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      ATTENDANCE_DB_URL: jdbc:mysql://mysql-attendance:3306/attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      ATTENDANCE_DB_USERNAME: root
      ATTENDANCE_DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICE_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql-attendance:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks: [attendai-net]

  # ── Leave Service ─────────────────────────────────────────────────────────────
  leave-service:
    build:
      context: ./backend/leave-service
      dockerfile: Dockerfile
    container_name: leave-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      LEAVE_DB_URL: jdbc:mysql://mysql-leave:3306/leave_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      LEAVE_DB_USERNAME: root
      LEAVE_DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICE_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql-leave:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks: [attendai-net]

  # ── Notification Service ──────────────────────────────────────────────────────
  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      NOTIFICATION_DB_URL: jdbc:mysql://mysql-notification:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      NOTIFICATION_DB_USERNAME: root
      NOTIFICATION_DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICE_URL: http://eureka-server:8761/eureka/
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      mysql-notification:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks: [attendai-net]

  # ── AI Agent Service ──────────────────────────────────────────────────────────
  ai-agent-service:
    build:
      context: ./backend/ai-agent-service
      dockerfile: Dockerfile
    container_name: ai-agent-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      AI_DB_URL: jdbc:mysql://mysql-ai:3306/ai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      AI_DB_USERNAME: root
      AI_DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICE_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql-ai:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks: [attendai-net]

  # ── React Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks: [attendai-net]

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  mysql-auth-data:
  mysql-employee-data:
  mysql-attendance-data:
  mysql-leave-data:
  mysql-notification-data:
  mysql-ai-data:
